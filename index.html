<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Reggeli Jelentés</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#eef1f3;
    --panel:#ffffff;
    --ink:#12181d;
    --ink-soft:#4a565f;
    --ink-faint:#8b97a0;
    --line:#dbe1e6;
    --line-soft:#e8ecef;
    --accent:#0b5d5d;
    --accent-bright:#12938f;
    --cat-modell:#4b5bd6;
    --cat-termek:#0e8a7a;
    --cat-szabalyozas:#8455a6;
    --cat-howto:#3f8f4e;
    --alert:#d64535;
    --alert-bg:#fdf0ee;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,24,29,.04), 0 8px 24px rgba(18,24,29,.05);
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --display:"Space Grotesk","IBM Plex Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:rgba(238,241,243,.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:820px;margin:0 auto;padding:18px 20px 14px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent-bright);
    box-shadow:0 0 0 0 rgba(18,147,143,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,147,143,.45)}70%{box-shadow:0 0 0 9px rgba(18,147,143,0)}100%{box-shadow:0 0 0 0 rgba(18,147,143,0)}}
  h1.title{
    font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;
    margin:8px 0 2px;letter-spacing:-.01em;
  }
  .subhead{font-size:13.5px;color:var(--ink-soft);font-family:var(--mono)}

  /* ---------- Signal strip ---------- */
  .signals{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .signal{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;display:flex;align-items:baseline;gap:8px;flex:1;min-width:96px;
  }
  .signal .num{font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
  .signal .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
  .signal.alert .num{color:var(--alert)}

  /* ---------- Filters ---------- */
  .controls{max-width:820px;margin:16px auto 0;padding:0 20px}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  #search{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);
    border-radius:11px;background:var(--panel);font-family:var(--sans);font-size:15px;color:var(--ink);
  }
  #search:focus{outline:none;border-color:var(--accent-bright);box-shadow:0 0 0 3px rgba(18,147,143,.14)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;gap:7px;color:var(--ink-soft);white-space:nowrap;
    transition:border-color .15s,background .15s,color .15s;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
  .chip[data-cat="modell"] .dot{background:var(--cat-modell)}
  .chip[data-cat="termek"] .dot{background:var(--cat-termek)}
  .chip[data-cat="szabalyozas"] .dot{background:var(--cat-szabalyozas)}
  .chip[data-cat="howto"] .dot{background:var(--cat-howto)}
  .chip.active{color:var(--ink);border-color:var(--ink);background:#fff}
  .chip.alert-chip.active{border-color:var(--alert);color:var(--alert)}
  .chip:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}

  /* ---------- Feed ---------- */
  main{max-width:820px;margin:0 auto;padding:8px 20px 80px}
  .daygroup{margin-top:26px}
  .dayhead{
    display:flex;align-items:center;gap:12px;margin-bottom:12px;
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  }
  .dayhead .rule{flex:1;height:1px;background:var(--line)}
  .dayhead .today{color:var(--accent);font-weight:500}

  .card{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px 16px 20px;margin-bottom:12px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink-faint)}
  .card[data-cat="modell"]::before{background:var(--cat-modell)}
  .card[data-cat="termek"]::before{background:var(--cat-termek)}
  .card[data-cat="szabalyozas"]::before{background:var(--cat-szabalyozas)}
  .card[data-cat="howto"]::before{background:var(--cat-howto)}

  .card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .cat-tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:500;padding:2px 8px;border-radius:6px;color:#fff;
  }
  .cat-tag[data-cat="modell"]{background:var(--cat-modell)}
  .cat-tag[data-cat="termek"]{background:var(--cat-termek)}
  .cat-tag[data-cat="szabalyozas"]{background:var(--cat-szabalyozas)}
  .cat-tag[data-cat="howto"]{background:var(--cat-howto)}
  .meta-dot{color:var(--ink-faint);font-size:12px}
  .meta-txt{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

  .card h2{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.25;margin:0 0 7px;letter-spacing:-.005em}
  .card .summary{font-size:14.5px;color:var(--ink-soft);margin:0 0 12px}

  .card-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;
    color:var(--accent);text-decoration:none;padding:4px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;transition:border-color .15s,background .15s;
  }
  .src:hover{border-color:var(--accent-bright);background:#f2fbfa}
  .src svg{opacity:.7}
  .src-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
  .thread-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
    color:var(--ink-soft);cursor:pointer;padding:4px 9px;border:1px dashed var(--line);border-radius:8px;background:none;font-family:var(--sans);
  }
  .thread-link:hover{border-color:var(--accent-bright);color:var(--accent)}

  /* contradiction */
  .conflict-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    color:var(--alert);background:var(--alert-bg);border:1px solid #f2c9c3;border-radius:8px;
    padding:4px 9px;cursor:pointer;font-family:var(--sans);
  }
  .conflict-panel{
    margin-top:12px;border:1px solid #f2c9c3;background:var(--alert-bg);border-radius:10px;
    padding:12px 14px;display:none;
  }
  .conflict-panel.open{display:block}
  .conflict-panel .cp-head{font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--alert);margin-bottom:8px}
  .cp-side{display:flex;gap:10px;padding:7px 0;border-top:1px solid #f2d3ce}
  .cp-side:first-of-type{border-top:none}
  .cp-side .cp-src{font-family:var(--mono);font-size:11px;color:var(--alert);flex:0 0 auto;padding-top:2px}
  .cp-side .cp-claim{font-size:13.5px;color:var(--ink)}

  /* ---------- Thread drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(18,24,29,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--bg);
    z-index:70;transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.61,.36,1);
    box-shadow:-12px 0 40px rgba(18,24,29,.16);overflow-y:auto;
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{position:sticky;top:0;background:var(--bg);padding:20px 22px 12px;border-bottom:1px solid var(--line)}
  .drawer-head .eyebrow{margin-bottom:6px}
  .drawer-head h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0;line-height:1.2}
  .drawer-close{position:absolute;top:16px;right:16px;border:none;background:var(--panel);border:1px solid var(--line);width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1}
  .timeline{padding:18px 22px 40px;position:relative}
  .tl-item{position:relative;padding:0 0 20px 26px}
  .tl-item::before{content:"";position:absolute;left:5px;top:6px;bottom:-4px;width:2px;background:var(--line)}
  .tl-item:last-child::before{display:none}
  .tl-item .node{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent-bright)}
  .tl-item.newest .node{background:var(--accent-bright)}
  .tl-date{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .tl-title{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.3;margin-bottom:4px}
  .tl-sum{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .tl-src{font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}

  /* ---------- States ---------- */
  .state{text-align:center;padding:70px 20px;color:var(--ink-faint)}
  .state h2{font-family:var(--display);color:var(--ink-soft);font-weight:600;font-size:18px;margin:0 0 6px}
  .state p{margin:0;font-size:14px}
  .banner{
    max-width:820px;margin:14px auto 0;padding:9px 20px;font-family:var(--mono);font-size:11.5px;
    color:var(--ink-faint);text-align:center;
  }
  footer.foot{max-width:820px;margin:0 auto;padding:28px 20px 40px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.7}

  @media (max-width:560px){
    h1.title{font-size:25px}
    .signal{min-width:0}
    .signal .num{font-size:19px}
    .card h2{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="eyebrow"><span class="pulse"></span> Napi AI hírszerzés</div>
    <h1 class="title">AI Reggeli Jelentés</h1>
    <div class="subhead" id="dateline">Betöltés…</div>
    <div class="signals" id="signals"></div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Keresés a hírekben és összefoglalókban…" autocomplete="off" />
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-cat="all">Összes</button>
    <button class="chip" data-cat="modell"><span class="dot"></span>Modell / kutatás</button>
    <button class="chip" data-cat="termek"><span class="dot"></span>Termék / üzlet</button>
    <button class="chip" data-cat="szabalyozas"><span class="dot"></span>Szabályozás / biztonság</button>
    <button class="chip" data-cat="howto"><span class="dot"></span>Eszköz / how-to</button>
    <button class="chip alert-chip" data-cat="conflict">⚠ Csak ellentmondások</button>
  </div>
</div>

<div class="banner" id="banner" style="display:none"></div>
<main id="feed"><div class="state"><p>Betöltés…</p></div></main>

<footer class="foot" id="foot"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <button class="drawer-close" id="drawerClose" aria-label="Bezárás">✕</button>
    <div class="eyebrow">Témaszál</div>
    <h3 id="threadTitle"></h3>
  </div>
  <div class="timeline" id="timeline"></div>
</aside>

<script>
/* =========================================================================
   ADATBETÖLTÉS
   Éles működésben a ./data/index.json + napi fájlok töltődnek be.
   Ha ez nem elérhető (pl. itt az előnézetben), a beépített MINTA jelenik meg.
   ========================================================================= */

const CAT_LABEL = {
  modell:"Modell / kutatás", termek:"Termék / üzlet",
  szabalyozas:"Szabályozás / biztonság", howto:"Eszköz / how-to"
};

/* ---- Beépített minta-adat (demonstráció) ---- */
const SAMPLE = {
  generatedAt:"2026-08-13T06:10:00+02:00",
  threads:{
    "gpt52":{ title:"GPT-5.2 kiadás és a benchmark-vita", articleIds:["a1","b2","c1"] }
  },
  days:[
    { date:"2026-08-13", articles:[
      { id:"a1", category:"modell", time:"05:40",
        title:"Megjelent a GPT-5.2 — a fókusz a hosszú kontextuson és a hibaarány csökkentésén",
        summary:"Az OpenAI kiadta a GPT-5.2-t, amely a cég szerint jelentősen csökkenti a hallucinációt hosszú dokumentumok feldolgozásánál. A modell 1 millió tokenes kontextust kezel, és az ügynöki feladatokban ígér nagy ugrást. A hozzáférés fokozatosan gördül ki az API-n és a fizetős felületeken.",
        sources:[{name:"OpenAI Blog",url:"https://openai.com"},{name:"TechCrunch",url:"https://techcrunch.com"}],
        sourceCount:4, threadId:"gpt52",
        contradiction:{ note:"Ellentmondó benchmark-adatok",
          sides:[
            {claim:"Az OpenAI 22%-os javulást közöl a SWE-bench feladatokon az elődhöz képest.",source:"OpenAI Blog"},
            {claim:"Független tesztelők egyelőre 9-11% körüli javulást mértek ugyanezen a benchmarkon.",source:"Ars Technica"}
          ]}
      },
      { id:"h1", category:"howto", time:"07:15",
        title:"Gyakorlati útmutató: retrieval-augmented ügynökök építése kisebb csapatoknak",
        summary:"Egy részletes bejegyzés végigveszi, hogyan állítható össze megbízható RAG-ügynök néhány nyílt komponensből. Kiemeli a leggyakoribb hibát: a rossz minőségű darabolást (chunking) a forrásdokumentumoknál. Konkrét, másolható konfigurációs példákat is ad.",
        sources:[{name:"Simon Willison",url:"https://simonwillison.net"}], sourceCount:1, threadId:null, contradiction:null
      },
      { id:"s1", category:"szabalyozas", time:"08:02",
        title:"Az EU AI-hivatal pontosította az általános célú modellekre vonatkozó dokumentációs elvárásokat",
        summary:"Új iránymutatás jelent meg arról, milyen technikai dokumentációt kell a nagy modellek fejlesztőinek benyújtaniuk. A hangsúly a betanító adatok összefoglalásán és a rendszerkockázatok értékelésén van. A határidőket a legnagyobb modellekre szigorúbban szabják meg.",
        sources:[{name:"MIT Tech Review",url:"https://technologyreview.com"},{name:"The Verge",url:"https://theverge.com"}], sourceCount:2, threadId:null, contradiction:null
      }
    ]},
    { date:"2026-08-12", articles:[
      { id:"b2", category:"modell", time:"14:20",
        title:"Kiszivárgott részletek a GPT-5.2-ről a kiadás előtt",
        summary:"A hivatalos bejelentés előtt fejlesztői körökben terjedtek a modell képességeiről szóló korai adatok. A pletykák a megnövelt kontextusablakot és az árazás változását emelték ki. Az OpenAI ezeket akkor nem kommentálta.",
        sources:[{name:"Hacker News",url:"https://news.ycombinator.com"}], sourceCount:1, threadId:"gpt52", contradiction:null
      },
      { id:"t1", category:"termek", time:"11:05",
        title:"Nagy felhőszolgáltató integrálja a nyílt súlyú modelleket a fejlesztői platformjába",
        summary:"Bejelentették, hogy több népszerű nyílt modell natívan elérhető lesz a platform ügynök-építő eszközeiben. A cél a bezártság csökkentése és a költségoptimalizálás. A funkció előzetes hozzáféréssel indul a vállalati ügyfeleknek.",
        sources:[{name:"VentureBeat",url:"https://venturebeat.com"},{name:"TechCrunch",url:"https://techcrunch.com"}], sourceCount:3, threadId:null, contradiction:null
      }
    ]},
    { date:"2026-08-11", articles:[
      { id:"c1", category:"modell", time:"16:45",
        title:"Az OpenAI teasert adott ki a következő generációs modellről",
        summary:"Rövid, hivatalos előzetes utalt egy közelgő modellfrissítésre, konkrét dátum nélkül. A közlemény a megbízhatóság és az ügynöki képességek javítását ígérte. Az iparági várakozás ezután gyorsan felerősödött.",
        sources:[{name:"OpenAI Blog",url:"https://openai.com"}], sourceCount:1, threadId:"gpt52", contradiction:null
      },
      { id:"r1", category:"modell", time:"09:30",
        title:"Új kutatás: a kisebb modellek célzott finomhangolással megközelítik a nagyokat szűk feladatokon",
        summary:"Egy arXiv-tanulmány szerint gondosan válogatott adatokkal a kisebb modellek néhány konkrét feladaton felzárkóznak a jóval nagyobbakhoz. A szerzők a minőségi adat fontosságát hangsúlyozzák a puszta méret helyett. A módszertan reprodukálható kódját is közzétették.",
        sources:[{name:"arXiv cs.CL",url:"https://arxiv.org"},{name:"Papers with Code",url:"https://paperswithcode.com"}], sourceCount:2, threadId:null, contradiction:null
      }
    ]}
  ]
};

/* ---- Állapot ---- */
let DATA = null;
let activeCats = new Set(["all"]);
let onlyConflict = false;
let query = "";

/* ---- Betöltés: próbáljuk az éles ./data/-t, különben minta ---- */
async function loadData(){
  try{
    const idxRes = await fetch("./data/index.json", {cache:"no-store"});
    if(!idxRes.ok) throw new Error("no index");
    const idx = await idxRes.json();
    const days = [];
    for(const d of idx.days){
      const dr = await fetch(`./data/${d}.json`, {cache:"no-store"});
      if(dr.ok) days.push(await dr.json());
    }
    DATA = { generatedAt:idx.generatedAt, threads:idx.threads||{}, days };
    hideBanner();
  }catch(e){
    DATA = SAMPLE;
    showBanner("Előnézeti mód — beépített minta-hírek. Éles telepítés után az élő napi adat jelenik meg.");
  }
  render();
}

function showBanner(t){const b=document.getElementById("banner");b.textContent=t;b.style.display="block";}
function hideBanner(){document.getElementById("banner").style.display="none";}

/* ---- Segéd: dátum formázás ---- */
const HU_DATE = new Intl.DateTimeFormat("hu-HU",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
function fmtDay(iso){
  const d=new Date(iso+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  if(diff===0) return {label:"Ma", sub:HU_DATE.format(d), today:true};
  if(diff===1) return {label:"Tegnap", sub:HU_DATE.format(d), today:false};
  return {label:HU_DATE.format(d), sub:"", today:false};
}

/* ---- Signal strip ---- */
function renderSignals(){
  let news=0, conflicts=0;
  const threadSet=new Set();
  for(const day of DATA.days) for(const a of day.articles){
    news++; if(a.contradiction) conflicts++; if(a.threadId) threadSet.add(a.threadId);
  }
  const el=document.getElementById("signals");
  el.innerHTML = `
    <div class="signal"><span class="num">${news}</span><span class="lbl">hír</span></div>
    <div class="signal"><span class="num">${threadSet.size}</span><span class="lbl">aktív szál</span></div>
    <div class="signal alert"><span class="num">${conflicts}</span><span class="lbl">ellentmondás</span></div>`;
  const gen=new Date(DATA.generatedAt);
  document.getElementById("dateline").textContent =
    "Frissítve: " + gen.toLocaleString("hu-HU",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

/* ---- Kártya HTML ---- */
function cardHTML(a){
  const q=query.trim().toLowerCase();
  if(q && !(a.title+" "+a.summary).toLowerCase().includes(q)) return "";
  if(onlyConflict && !a.contradiction) return "";
  if(!activeCats.has("all") && !activeCats.has(a.category)) return "";

  const srcHTML = a.sources.map(s=>
    `<a class="src" href="${s.url}" target="_blank" rel="noopener">
       <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
       ${s.name}</a>`).join("");
  const extra = a.sourceCount>a.sources.length
    ? `<span class="src-count">+${a.sourceCount-a.sources.length} további forrás</span>` : "";
  const thread = a.threadId && DATA.threads[a.threadId]
    ? `<button class="thread-link" data-thread="${a.threadId}">
         <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6"/><path d="M13 6h5a2 2 0 0 1 2 2v8"/></svg>
         Szál: ${DATA.threads[a.threadId].title}</button>` : "";
  let conflict="";
  if(a.contradiction){
    const sides=a.contradiction.sides.map(s=>
      `<div class="cp-side"><span class="cp-src">${s.source}</span><span class="cp-claim">${s.claim}</span></div>`).join("");
    conflict = `<button class="conflict-badge" data-conflict="${a.id}">⚠ ${a.contradiction.note}</button>
      <div class="conflict-panel" id="cp-${a.id}">
        <div class="cp-head">Ütköző állítások</div>${sides}</div>`;
  }
  return `<article class="card" data-cat="${a.category}">
    <div class="card-meta">
      <span class="cat-tag" data-cat="${a.category}">${CAT_LABEL[a.category]}</span>
      <span class="meta-dot">•</span><span class="meta-txt">${a.time}</span>
      ${a.sourceCount>1?`<span class="meta-dot">•</span><span class="meta-txt">${a.sourceCount} forrás írt róla</span>`:""}
    </div>
    <h2>${a.title}</h2>
    <p class="summary">${a.summary}</p>
    <div class="card-foot">${srcHTML}${extra}${thread}${a.contradiction?conflict:""}</div>
  </article>`;
}

/* ---- Feed render ---- */
function render(){
  renderSignals();
  const feed=document.getElementById("feed");
  let html="", anyShown=false;
  for(const day of DATA.days){
    const cards = day.articles.map(cardHTML).join("");
    if(!cards.trim()) continue;
    anyShown=true;
    const f=fmtDay(day.date);
    html += `<section class="daygroup">
      <div class="dayhead"><span class="${f.today?'today':''}">${f.label}</span>
      ${f.sub?`<span>${f.sub}</span>`:""}<span class="rule"></span></div>${cards}</section>`;
  }
  feed.innerHTML = anyShown ? html :
    `<div class="state"><h2>Nincs találat</h2><p>Módosítsd a szűrőket vagy a keresést.</p></div>`;
  document.getElementById("foot").innerHTML =
    "AI Reggeli Jelentés · automatikusan frissül minden reggel<br>Az összefoglalók AI által készültek — fontos döntés előtt nézd meg az eredeti forrást.";
  bindCardEvents();
}

/* ---- Események ---- */
function bindCardEvents(){
  document.querySelectorAll("[data-conflict]").forEach(b=>b.onclick=()=>{
    document.getElementById("cp-"+b.dataset.conflict).classList.toggle("open");
  });
  document.querySelectorAll("[data-thread]").forEach(b=>b.onclick=()=>openThread(b.dataset.thread));
}

document.getElementById("chips").addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(!chip) return;
  const cat=chip.dataset.cat;
  if(cat==="conflict"){ onlyConflict=!onlyConflict; chip.classList.toggle("active",onlyConflict); render(); return; }
  document.querySelectorAll('.chip:not(.alert-chip)').forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  activeCats = new Set([cat]);
  render();
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render();});

/* ---- Témaszál drawer ---- */
function openThread(id){
  const t=DATA.threads[id]; if(!t) return;
  const all=[];
  for(const day of DATA.days) for(const a of day.articles)
    if(t.articleIds.includes(a.id)) all.push({...a, date:day.date});
  all.sort((x,y)=> y.date.localeCompare(x.date));
  document.getElementById("threadTitle").textContent=t.title;
  document.getElementById("timeline").innerHTML = all.map((a,i)=>{
    const f=fmtDay(a.date);
    return `<div class="tl-item ${i===0?'newest':''}"><span class="node"></span>
      <div class="tl-date">${f.label==='Ma'||f.label==='Tegnap'?f.label:HU_DATE.format(new Date(a.date+'T00:00:00'))} · ${a.time}</div>
      <div class="tl-title">${a.title}</div>
      <div class="tl-sum">${a.summary}</div>
      <a class="tl-src" href="${a.sources[0].url}" target="_blank" rel="noopener">${a.sources[0].name} ↗</a></div>`;
  }).join("");
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("open");
}
function closeThread(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("open");
}
document.getElementById("drawerClose").onclick=closeThread;
document.getElementById("scrim").onclick=closeThread;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeThread();});

loadData();
</script>
