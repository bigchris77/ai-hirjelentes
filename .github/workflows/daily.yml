name: Napi AI hírgyűjtés

# Mikor fusson:
on:
  schedule:
    - cron: "0 4 * * *"        # minden nap 04:00 UTC (~06:00 magyar idő nyáron)
  workflow_dispatch:            # + kézi indítás gomb az Actions fülön

# Engedély a frissített adat visszaírásához a tárolóba:
permissions:
  contents: write

# Egyszerre csak egy futás:
concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Tároló letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Hírek gyűjtése és feldolgozása
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/collect.py

      - name: Frissített adat mentése a tárolóba
        run: |
          git config user.name  "hir-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nincs változás — nincs mit menteni."
          else
            git commit -m "Napi hírfrissítés: $(date -u +%Y-%m-%d)"
            git push
          fi
